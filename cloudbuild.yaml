steps:
  # 1. Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: Build
    args:
      - "build"
      - "-t"
      - "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/athena-core-api:$COMMIT_SHA"
      - "."

  # 2. Push the Docker image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: Push
    args:
      - "push"
      - "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/athena-core-api:$COMMIT_SHA"

  # 3. Deploy the container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: Deploy
    args:
      - "gcloud"
      - "run"
      - "deploy"
      - "athena-core-api"
      - "--image"
      - "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/athena-core-api:$COMMIT_SHA"
      - "--region"
      - "$_REGION"
      - "--platform"
      - "managed"
      # core_api stays PRIVATE (invoker-only). Do NOT add --allow-unauthenticated.
      # Only the proxy service identity should be able to reach it.

      # --- Secrets: pulled from Secret Manager at deploy time, never baked into the image ---
      # FAMILY_CHORES_PARTNER_SECRET gates the Family Chores partner endpoints
      # (connect / disconnect / suggest-chores). Create it per SECURITY_SETUP.md.
      - "--update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,DB_PASS=DB_PASS:latest,JWT_SECRET=JWT_SECRET:latest,RECAPTCHA_SECRET=RECAPTCHA_SECRET:latest,FAMILY_CHORES_PARTNER_SECRET=FAMILY_CHORES_PARTNER_SECRET:latest"

      # NOTE: ATHENA_ENC_KEYRING is deliberately NOT injected here. It is read
      # at runtime from Secret Manager (src/services/secrets) so the monthly
      # rotation job's new version is picked up without a redeploy. Injecting
      # it as an env var would pin the keyring to deploy time — env wins over
      # Secret Manager — and decryption would break after the first rotation.
      # The runtime SA needs roles/secretmanager.secretAccessor on it; see
      # deploy/scripts/setup-key-rotation.sh.

      # --- Non-secret runtime config (use a custom ^@^ delimiter so values can contain commas) ---
      # --set-env-vars REPLACES the whole set, so every runtime var the service
      # needs must be listed here. Anything set out-of-band with `gcloud run
      # services update` is wiped by the next deploy — which is exactly how the
      # OAuth connector callback broke once already.
      - "--set-env-vars=^@^GCP_PROJECT_ID=$PROJECT_ID@DB_HOST=$_DB_HOST@DB_USER=$_DB_USER@DB_NAME=$_DB_NAME@RECAPTCHA_PROJECT_ID=$_RECAPTCHA_PROJECT_ID@RECAPTCHA_SITE_KEY=$_RECAPTCHA_SITE_KEY@PUBLIC_SESSION_MESSAGE_DAILY_LIMIT=$_PUBLIC_SESSION_MESSAGE_DAILY_LIMIT@PUBLIC_IP_MESSAGE_DAILY_LIMIT=$_PUBLIC_IP_MESSAGE_DAILY_LIMIT@FAMILY_CHORES_ADMIN_ROLES=$_FAMILY_CHORES_ADMIN_ROLES@PUBLIC_API_BASE_URL=$_PUBLIC_API_BASE_URL@INTEGRATION_REDIRECT_ALLOWLIST=$_INTEGRATION_REDIRECT_ALLOWLIST"

  # 4. Move the Cloud Run JOBS onto the image this build just deployed.
  #
  # The jobs run out of this same repo (src/jobs/*.js), but nothing used to
  # update them: each was created once with a pinned :$COMMIT_SHA and stayed
  # there. athena-nightly sat on a 2026-09-12 image for eight days, writing
  # nightly reports out of code that no longer matched the repo — five
  # maintenance steps it never knew about. A job is only as current as its
  # last deploy, so its deploy belongs here and not in anyone's memory.
  #
  # Do NOT do this by tagging :latest. cloudbuild pushes :$COMMIT_SHA and
  # never moves :latest, so a job pinned to :latest would be pinned to
  # nothing (the docs used to suggest exactly that).
  #
  # `jobs update` is a partial update: passing only --image leaves each job's
  # own args, env vars and secrets alone. That matters — the jobs do NOT
  # share the service's env, and re-specifying it here would be the same trap
  # as --set-env-vars above.
  #
  # A job that doesn't exist in this project is skipped, not fatal, so this
  # stays correct before athena-news is stood up and after any job is retired.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: UpdateJobs
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        IMAGE="$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/athena-core-api:$COMMIT_SHA"
        for job in $_JOBS; do
          if gcloud run jobs describe "$$job" --region "$_REGION" >/dev/null 2>&1; then
            echo "==> $$job -> $COMMIT_SHA"
            gcloud run jobs update "$$job" --region "$_REGION" --image "$$IMAGE"
          else
            echo "==> $$job is not deployed in this project; skipping"
          fi
        done

# The final image tag is saved in the Artifact Registry
images:
  - "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/athena-core-api:$COMMIT_SHA"

# Substitute variables.
# Secrets are NOT here — they live in Secret Manager (see SECURITY_SETUP.md).
substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _REGION: us-central1
  # Cloud Run Jobs that run this same image (core_api/src/jobs/*.js) and so
  # must move with it — see the UpdateJobs step. Space-separated, and each has
  # to live in $_REGION; a name that isn't deployed is skipped, which is why
  # athena-news can be listed before setup-news-watch.sh has ever been run.
  _JOBS: "athena-nightly athena-rotate-keys athena-news athena-incidents"
  # Non-secret config — override per environment if needed.
  _DB_HOST: "134.209.79.220"
  _DB_USER: "rbryson"
  _DB_NAME: "athena"
  _RECAPTCHA_PROJECT_ID: "athena-476423"
  _RECAPTCHA_SITE_KEY: "6Lc2OiAsAAAAAHZXE64gzTrmdKvvxVMjqdxUa8O5"
  _PUBLIC_SESSION_MESSAGE_DAILY_LIMIT: "100"
  _PUBLIC_IP_MESSAGE_DAILY_LIMIT: "300"
  # Family Chores roles allowed to connect Athena (matched against /me.role).
  # Adjust to match Family Chores' real parent/admin role names.
  _FAMILY_CHORES_ADMIN_ROLES: "parent,admin,owner,guardian"
  # Public base URL of the API as the BROWSER sees it — the proxy, not this
  # service. OAuth redirect URIs are built from it, and each must be registered
  # with the provider as <_PUBLIC_API_BASE_URL>/integrations/<provider>/callback.
  _PUBLIC_API_BASE_URL: "https://athena-proxy-api-12367074465.us-central1.run.app/api/v1"
  # Origins the connector callback may hand the browser back to; the first is
  # the default. The callback is public, so this list is the only thing keeping
  # it from being an open redirect — keep it to the apps that actually start an
  # OAuth connect (today: Companion; Guardians ships no connector UI). An empty
  # value means local dev, where the callback answers with JSON instead.
  _INTEGRATION_REDIRECT_ALLOWLIST: "https://athena-companion-mlkumvppsa-uc.a.run.app,https://athena-companion-12367074465.us-central1.run.app"
options:
  logging: CLOUD_LOGGING_ONLY
